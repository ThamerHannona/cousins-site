<!doctype html><html lang="en"><head><meta charset="utf-8"><title>COUSINS</title><meta name="robots" content="noindex"><script>
// cousinsai.com/join/<id> → cousinsai.com/join/?t=<id> (GitHub Pages has no server-side routes).
(function () { var m = location.pathname.match(/^\/join\/([A-Za-z0-9_-]{22,64})\/?$/); if (m) location.replace("/join/?t=" + m[1]); else location.replace("/"); })();
</script></head><body></body></html>
